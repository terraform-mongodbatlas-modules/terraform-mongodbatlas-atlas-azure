examples:
  - name: backup_export
    var_groups: [backup_export]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_setup.this[0]
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_authorization.this[0]
      - address: module.atlas_azure.module.backup_export[0].azurerm_storage_account.atlas[0]
        dump:
          skip_lines:
            redact_attributes:
              - name
      - address: module.atlas_azure.module.backup_export[0].azurerm_storage_management_policy.atlas[0]
      - address: module.atlas_azure.module.backup_export[0].azurerm_storage_container.atlas[0]
      - address: module.atlas_azure.module.backup_export[0].azurerm_role_assignment.backup_export[0]
      - address: module.atlas_azure.module.backup_export[0].mongodbatlas_cloud_backup_snapshot_export_bucket.this

  - name: encryption
    var_groups: [encryption]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_setup.this[0]
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_authorization.this[0]
      - address: module.atlas_azure.module.encryption[0].mongodbatlas_encryption_at_rest.this
      - address: module.atlas_azure.module.encryption[0].azurerm_role_assignment.key_vault_crypto[0]
      - address: module.atlas_azure.module.encryption[0].azurerm_role_assignment.key_vault_reader[0]

  - name: privatelink
    var_groups: [privatelink]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_privatelink_endpoint.this["eastus2"]
      - address: module.atlas_azure.module.privatelink["eastus2"].azurerm_private_endpoint.atlas[0]
      - address: module.atlas_azure.module.privatelink["eastus2"].mongodbatlas_privatelink_endpoint_service.this

  - name: privatelink_byoe
    var_groups: [privatelink_byoe]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_privatelink_endpoint.this["pe1"]
      - address: module.atlas_azure.module.privatelink["pe1"].mongodbatlas_privatelink_endpoint_service.this

  - name: log_integration
    var_groups: [log_integration]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_setup.this[0]
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_authorization.this[0]
      - address: module.atlas_azure.module.log_integration[0].azurerm_storage_account.atlas[0]
        dump:
          skip_lines:
            redact_attributes:
              - name
      - address: module.atlas_azure.module.log_integration[0].azurerm_storage_container.atlas[0]
      - address: module.atlas_azure.module.log_integration[0].azurerm_role_assignment.log_integration[0]
      - address: module.atlas_azure.module.log_integration[0].azurerm_storage_management_policy.atlas[0]
      - address: module.atlas_azure.module.log_integration[0].mongodbatlas_log_integration.this[0]

  - name: log_integration_byo
    var_groups: [log_integration_byo]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_setup.this[0]
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_authorization.this[0]
      - address: module.atlas_azure.module.log_integration[0].azurerm_storage_container.atlas[0]
      - address: module.atlas_azure.module.log_integration[0].azurerm_role_assignment.log_integration[0]
      - address: module.atlas_azure.module.log_integration[0].mongodbatlas_log_integration.this[0]
      - address: module.atlas_azure.module.log_integration[0].mongodbatlas_log_integration.this[1]
      - address: azurerm_storage_account.logs
        dump:
          skip_lines:
            redact_attributes:
              - name

  - name: azure_read_only
    var_groups: [azure_read_only]
    module_depends_on:
      - time_sleep.azure_read_only_atlas
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_setup.this[0]
      - address: module.atlas_azure.mongodbatlas_cloud_provider_access_authorization.this[0]
      - address: module.atlas_azure.module.encryption[0].mongodbatlas_encryption_at_rest.this
      - address: module.atlas_azure.module.backup_export[0].azurerm_storage_container.atlas[0]
      - address: module.atlas_azure.module.backup_export[0].mongodbatlas_cloud_backup_snapshot_export_bucket.this
      - address: module.atlas_azure.module.log_integration[0].azurerm_storage_container.atlas[0]
      - address: module.atlas_azure.module.log_integration[0].mongodbatlas_log_integration.this[0]
      - address: module.atlas_azure.module.log_integration[0].mongodbatlas_log_integration.this[1]

  - name: privatelink_multi_region
    var_groups: [privatelink_multi_region]
    plan_regressions:
      - address: module.atlas_azure.mongodbatlas_private_endpoint_regional_mode.this[0]
      - address: module.atlas_azure.mongodbatlas_privatelink_endpoint.this["eastus2"]
      - address: module.atlas_azure.mongodbatlas_privatelink_endpoint.this["westus2"]
      - address: module.atlas_azure.module.privatelink["eastus2"].azurerm_private_endpoint.atlas[0]
      - address: module.atlas_azure.module.privatelink["eastus2"].mongodbatlas_privatelink_endpoint_service.this
      - address: module.atlas_azure.module.privatelink["westus2"].azurerm_private_endpoint.atlas[0]
      - address: module.atlas_azure.module.privatelink["westus2"].mongodbatlas_privatelink_endpoint_service.this

var_groups:
  backup_export:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id_backup_export
    - name: subscription_id
      expose_in_workspace: false
      module_value: var.subscription_id
    - name: resource_group_name
      expose_in_workspace: false
      module_value: local.resource_group_name
    - name: atlas_azure_app_id
      expose_in_workspace: false
      module_value: local.atlas_azure_app_id
    - name: service_principal_id
      expose_in_workspace: false
      module_value: local.service_principal_id
    - name: create_service_principal
      expose_in_workspace: false
      module_value: "false"
    - name: storage_account_name
      expose_in_workspace: false
      module_value: local.storage_account_name

  encryption:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id_encryption
    - name: subscription_id
      expose_in_workspace: false
      module_value: var.subscription_id
    - name: resource_group_name
      expose_in_workspace: false
      module_value: local.resource_group_name
    - name: service_principal_id
      expose_in_workspace: false
      module_value: local.service_principal_id
    - name: atlas_azure_app_id
      expose_in_workspace: false
      module_value: local.atlas_azure_app_id
    - name: key_vault_name
      expose_in_workspace: false
      module_value: local.key_vault_name
    - name: purge_protection_enabled
      expose_in_workspace: false
      module_value: "false"
    - name: soft_delete_retention_days
      expose_in_workspace: false
      module_value: "7"

  log_integration:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id_log_integration
    - name: subscription_id
      expose_in_workspace: false
      module_value: var.subscription_id
    - name: resource_group_name
      expose_in_workspace: false
      module_value: local.resource_group_name
    - name: atlas_azure_app_id
      expose_in_workspace: false
      module_value: local.atlas_azure_app_id
    - name: service_principal_id
      expose_in_workspace: false
      module_value: local.service_principal_id
    - name: create_service_principal
      expose_in_workspace: false
      module_value: "false"
    - name: azure_location
      expose_in_workspace: false
      module_value: local.azure_location
    - name: storage_account_name
      expose_in_workspace: false
      module_value: local.storage_account_name_log_integration

  log_integration_byo:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id_log_integration_byo
    - name: subscription_id
      expose_in_workspace: false
      module_value: var.subscription_id
    - name: resource_group_name
      expose_in_workspace: false
      module_value: local.resource_group_name
    - name: atlas_azure_app_id
      expose_in_workspace: false
      module_value: local.atlas_azure_app_id
    - name: service_principal_id
      expose_in_workspace: false
      module_value: local.service_principal_id
    - name: create_service_principal
      expose_in_workspace: false
      module_value: "false"
    - name: azure_location
      expose_in_workspace: false
      module_value: local.azure_location
    - name: storage_account_name
      expose_in_workspace: false
      module_value: local.storage_account_name_byo_log

  azure_read_only:
    - name: project_id
      expose_in_workspace: false
      module_value: local.project_id_azure_read_only
    - name: subscription_id
      expose_in_workspace: false
      module_value: var.subscription_id
    - name: atlas_azure_app_id
      expose_in_workspace: false
      module_value: local.atlas_azure_app_id
    - name: service_principal_id
      expose_in_workspace: false
      module_value: local.service_principal_id
    - name: key_vault_id
      expose_in_workspace: false
      module_value: local.key_vault_id_azure_read_only
    - name: key_identifier
      expose_in_workspace: false
      module_value: local.key_identifier_azure_read_only
    - name: backup_storage_account_id
      expose_in_workspace: false
      module_value: local.backup_storage_account_id_azure_read_only
    - name: backup_container_name
      expose_in_workspace: false
      module_value: "\"atlas-backup-exports\""
    - name: log_storage_account_id
      expose_in_workspace: false
      module_value: local.log_storage_account_id_azure_read_only
    - name: log_container_name
      expose_in_workspace: false
      module_value: "\"atlas-logs\""

  privatelink:
